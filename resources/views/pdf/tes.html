<!DOCTYPE html>
<html>
<head>
<style>
  .content-with-double-border {
    border: 3px double #ff0000; /* Apply a double border to all sides */
    padding: 10px;              /* Add padding inside the border */
    text-align: center;
  }
</style>
</head>
<body>

<h1>Example of Content with a Double Border</h1>
<div class="content-with-double-border">
  This content is inside a double-bordered box.
</div>

</body>
</html>
